services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: claimwise
      POSTGRES_USER: claimwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimwise -d claimwise"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: PostgreSQL
      Database__AutoMigrate: "true"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=claimwise;Username=claimwise;Password=${POSTGRES_PASSWORD}"
      Seed__Enabled: "true"
      ClaimFiles__Path: /app/claim-files
      Cors__AllowedOrigins__0: http://localhost:8081
    volumes:
      - ./src/ClaimWise.Api/claim-files:/app/claim-files
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data: